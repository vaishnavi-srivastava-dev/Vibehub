spring.application.name=vibehub

server.port=80

#DB CONFIGURATION
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/vibehub?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

#To create a table, we need to give DDL permission to Hibernate
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true

#spring.security.user.name = vaishnavi
#spring.security.user.password = root@admin123
#Change environment to dev
spring.profiles.active = prod